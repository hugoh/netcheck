# The engine's public surface is consumed by two separate executable
# targets and the test bundle, which Periphery's single-module scan can't
# all see — keep public declarations, and don't flag Codable/Equatable
# stored properties that are "only assigned" (they're read by the
# synthesized conformances).
retain_public: true
retain_codable_properties: true
retain_assign_only_property_types:
  - Bool
  - String
  - Int
  - Double
  - UInt16
  - UInt32
