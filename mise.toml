[tools]
rust = "1.96.0"
hk = "1.56.0"
actionlint = "1.7.12"
pinact = "4.1.1"
zizmor = "1.29.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
typos = "1.49.0"
rumdl = "0.2.55"
tombi = "1.4.0"
"github:owenlamont/ryl" = "0.21.0"
biome = "2.5.8"
shellcheck = "0.11.0"
"aqua:anordal/shellharden" = "4.3.2"
shfmt = "3.13.1"
cocogitto = "7.0.0"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"

[tasks."build:cli"]
description = "Build a netcheck-cli binary (pass --release for a release build)"
run = "cargo build -p netcheck-cli"

[tasks."build:tui"]
description = "Build a netcheck-tui binary (pass --release for a release build)"
run = "cargo build -p netcheck-tui"

[tasks."build:gui"]
description = "Build a netcheck-gui binary (pass --release for a release build)"
run = "cargo build -p netcheck-gui"

[tasks."build:dev"]
description = "Build dev versions of every binary: CLI, TUI, GUI, and the macOS app"
depends = ["build:cli", "build:tui", "build:gui", "build:app"]

[tasks."run:tui"]
description = "Run the netcheck-tui dashboard"
run = "cargo run -p netcheck-tui"

[tasks."run:gui"]
description = "Run the netcheck-gui window"
run = "cargo run -p netcheck-gui"

[tasks."run:app"]
description = "Build (if needed) and launch the dev NetCheck.app"
depends = ["build:app"]
run = "open target/dev-app/NetCheck.app"

[tasks."check:cargo-fmt"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"
sources = ["**/*.rs"]
outputs = { auto = true }

[tasks."check:cargo-clippy"]
description = "Lint Rust with clippy"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]
outputs = { auto = true }

[tasks."check:cargo-test"]
description = "Run the Rust test suite"
run = "cargo test --workspace"
sources = ["**/*.rs", "**/Cargo.toml", "Cargo.lock"]
outputs = { auto = true }

[tasks."check:cargo-deny"]
description = "Check licenses/duplicate-versions/unknown-sources via cargo-deny"
run = "cargo deny check"
sources = ["**/Cargo.toml", "Cargo.lock", "deny.toml"]
outputs = { auto = true }

[tasks."check:cargo-audit"]
description = "Scan Cargo.lock against RustSec advisories"
run = "cargo audit"
sources = ["Cargo.lock"]
outputs = { auto = true }
