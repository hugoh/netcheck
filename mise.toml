[tools]
rust = "1.96.0"
hk = "1.56.0"
actionlint = "1.7.12"
pinact = "4.1.1"
zizmor = "1.29.0"
ghalint = "1.5.6"
gitleaks = "8.30.1"
typos = "1.49.0"
rumdl = "0.2.55"
tombi = "1.4.0"
"github:owenlamont/ryl" = "0.21.0"
biome = "2.5.8"
shellcheck = "0.11.0"
"aqua:anordal/shellharden" = "4.3.2"
shfmt = "3.13.1"
cocogitto = "7.0.0"

[tasks."build:cli"]
description = "Build a dev netcheck-cli binary"
run = "cargo build -p netcheck-cli"

[tasks."build:tui"]
description = "Build a dev netcheck-tui binary"
run = "cargo build -p netcheck-tui"

[tasks."build:gui"]
description = "Build a dev netcheck-gui binary"
run = "cargo build -p netcheck-gui"

[tasks."build:cli-release"]
description = "Build a release netcheck-cli binary"
run = "cargo build --release -p netcheck-cli"

[tasks."build:gui-release"]
description = "Build a release netcheck-gui binary"
run = "cargo build --release -p netcheck-gui"

[tasks."build:dev"]
description = "Build dev versions of every binary: CLI, TUI, GUI, and the macOS app"
depends = ["build:cli", "build:tui", "build:gui", "build:app"]

[tasks."run:tui"]
description = "Run the netcheck-tui dashboard"
run = "cargo run -p netcheck-tui"

[tasks."run:gui"]
description = "Run the netcheck-gui window"
run = "cargo run -p netcheck-gui"

[tasks."run:app"]
description = "Build (if needed) and launch the dev NetCheckMac.app"
depends = ["build:app"]
run = "open target/dev-app/NetCheckMac.app"
