---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # Fast, cheap lint sweep on Linux: rumdl/biome/gitleaks/actionlint/typos/
  # shellcheck/etc. Deliberately doesn't touch the Rust toolchain — hk.pkl
  # excludes cargo_fmt/cargo_clippy/cargo_test from the `ci` profile so this
  # job never has to install Rust just to run hk.
  hk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-hk-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e3deb909891d6fc8089311f2e91e85796eb6c725 # v1.9.2
      - uses: hugoh/gh-workflows/hk-check@e3deb909891d6fc8089311f2e91e85796eb6c725 # v1.9.2

  # The real build/test, on macOS because this project's whole reason to
  # exist is macOS-specific behavior (scutil, ping, netdev's VPN detection).
  # A Linux build would only prove it compiles, not that it works.
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: ci-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e3deb909891d6fc8089311f2e91e85796eb6c725 # v1.9.2
      - name: Cargo build
        run: cargo build --workspace --locked
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Cargo test
        run: cargo test --workspace
      - name: Swift build
        working-directory: apps/NetCheckMac
        run: swift build -c release
      - name: Bundle netcheck-gui.app
        run: ./scripts/bundle-macos.sh
      - name: Upload NetCheck.app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NetCheck.app
          path: target/NetCheck.app
          retention-days: 14
