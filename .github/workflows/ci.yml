---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, cheap lint sweep on Linux: rumdl/gitleaks/actionlint/typos/
  # shellcheck/etc. Language-agnostic — no toolchain install.
  hk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-hk-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # Full history, not the default depth-1: pull_request events check out
      # a synthetic merge commit, and with a shallow/grafted fetch its true
      # parent count isn't visible to libgit2, so cog can't recognize it as
      # a merge commit and cog.toml's ignore_merge_commits doesn't apply.
      - uses: hugoh/gh-workflows/setup@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
        with:
          fetch-depth: "0"
      - uses: hugoh/gh-workflows/hk-check@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22

  # SwiftLint + build (warnings-as-errors) + test + periphery, on macOS —
  # netcheck's whole reason to exist is macOS-specific behavior
  # (SystemConfiguration, CoreWLAN, the routing table, ICMP).
  check-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: ci-check-macos-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
      - name: Cache Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/NetCheck/.build
          key: swift-build-${{ runner.os }}-${{ hashFiles('apps/NetCheck/Package.swift', 'apps/NetCheck/Package.resolved', 'apps/NetCheck/Sources/**', 'apps/NetCheck/Tests/**') }}
          restore-keys: |
            swift-build-${{ runner.os }}-
      - name: SwiftLint
        run: mise run check:swiftlint
      - name: SwiftFormat
        run: mise run check:swiftformat
      - name: Swift build
        run: mise run check:build
      - name: Swift test
        run: mise run test:swift
      - name: Swift test (live)
        run: mise run test-live
        continue-on-error: true
      - name: Periphery
        run: mise run check:periphery

  # Release build + app bundle. Runs in parallel with check-macos.
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: ci-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
      - name: Cache Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/NetCheck/.build
          key: swift-release-${{ runner.os }}-${{ hashFiles('apps/NetCheck/Package.swift', 'apps/NetCheck/Package.resolved', 'apps/NetCheck/Sources/**') }}
          restore-keys: |
            swift-release-${{ runner.os }}-
      - name: Bundle NetCheck.app
        run: mise run bundle:swiftui
      - name: Build netcheck CLI
        run: mise run build:cli
      - name: Upload NetCheck.app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NetCheck.app
          path: target/NetCheck.app
          retention-days: 14

  # The single required status check, and all that release waits on. Pages is
  # deliberately not gated: it only publishes the static site.
  ci-gate:
    if: always()
    needs: [hk, check-macos, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  release:
    needs: ci-gate
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: hugoh/gh-workflows/setup@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
        with:
          fetch-depth: "0"

      - name: Guard manual dispatch to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "::error::Manual bump_type dispatch must run on main (got ${GITHUB_REF})"
          exit 1

      - name: Semver release
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: bump
          args: --${{ inputs.bump_type || 'auto' }}

      - name: Determine tag
        id: tag
        run: |
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -z "$TAG" ]; then
            echo "No tag at HEAD — skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.tag.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "${TAG}"

      - name: Build netcheck CLI release binary
        if: steps.tag.outputs.skip != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          NETCHECK_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mise run build:cli
          BIN="apps/NetCheck/.build/release/netcheck"
          strip "$BIN"
          codesign --force --options runtime --sign - "$BIN"
          mkdir -p dist
          tar -czf "dist/netcheck-${TAG#v}-aarch64-apple-darwin.tar.gz" \
            -C "apps/NetCheck/.build/release" netcheck

      - name: Build & bundle NetCheck.app
        if: steps.tag.outputs.skip != 'true'
        env:
          NETCHECK_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mise run bundle:swiftui
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            target/NetCheck.app "dist/NetCheck-${NETCHECK_VERSION}.zip"

      - name: Create GitHub release
        if: steps.tag.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "${TAG}" dist/* --generate-notes

      - name: Update Homebrew tap
        if: steps.tag.outputs.skip != 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mise run release:homebrew-tap -- "${VERSION}" \
            "dist/netcheck-${VERSION}-aarch64-apple-darwin.tar.gz" \
            "dist/NetCheck-${VERSION}.zip"

  # Static landing page (site/), deployed to GitHub Pages. Only on pushes to
  # main — PRs just get the check/build jobs above.
  pages-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
      - name: Assemble site
        run: mise run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages-deploy:
    needs: pages-build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
