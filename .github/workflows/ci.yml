---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast, cheap lint sweep on Linux: rumdl/gitleaks/actionlint/typos/
  # shellcheck/etc. Language-agnostic — no toolchain install.
  hk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-hk-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # Full history, not the default depth-1: pull_request events check out
      # a synthetic merge commit, and with a shallow/grafted fetch its true
      # parent count isn't visible to libgit2, so cog can't recognize it as
      # a merge commit and cog.toml's ignore_merge_commits doesn't apply.
      - uses: hugoh/gh-workflows/setup@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20
        with:
          fetch-depth: "0"
      - uses: hugoh/gh-workflows/hk-check@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20

  # SwiftLint + build (warnings-as-errors) + test + periphery, on macOS —
  # netcheck's whole reason to exist is macOS-specific behavior
  # (SystemConfiguration, CoreWLAN, the routing table, ICMP).
  check-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: ci-check-macos-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20
      - name: Cache Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/NetCheck/.build
          key: swift-build-${{ runner.os }}-${{ hashFiles('apps/NetCheck/Package.swift', 'apps/NetCheck/Package.resolved', 'apps/NetCheck/Sources/**', 'apps/NetCheck/Tests/**') }}
          restore-keys: |
            swift-build-${{ runner.os }}-
      - name: SwiftLint
        run: mise run check:swiftlint
      - name: SwiftFormat
        run: mise run check:swiftformat
      - name: Swift build
        run: mise run check:build
      - name: Swift test
        run: mise run test:swift
      - name: Swift test (live)
        run: mise run test-live
        continue-on-error: true
      - name: Periphery
        run: mise run check:periphery

  # Release build + app bundle. Runs in parallel with check-macos.
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: ci-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20
      - name: Cache Swift build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/NetCheck/.build
          key: swift-release-${{ runner.os }}-${{ hashFiles('apps/NetCheck/Package.swift', 'apps/NetCheck/Package.resolved', 'apps/NetCheck/Sources/**') }}
          restore-keys: |
            swift-release-${{ runner.os }}-
      - name: Bundle NetCheck.app
        run: mise run bundle:swiftui
      - name: Build netcheck CLI
        run: mise run build:cli
      - name: Upload NetCheck.app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NetCheck.app
          path: target/NetCheck.app
          retention-days: 14

  # Static landing page (site/), deployed to GitHub Pages. Only on pushes to
  # main — PRs just get the check/build jobs above.
  pages-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e16fb522310fbdff89aab38e3d16d13ee5cff11e # v1.40.20
      - name: Assemble site
        run: mise run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages-deploy:
    needs: pages-build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
