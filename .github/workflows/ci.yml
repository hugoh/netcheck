---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  # Fast, cheap lint sweep on Linux: rumdl/biome/gitleaks/actionlint/typos/
  # shellcheck/etc. Deliberately doesn't touch the Rust toolchain — hk.pkl
  # excludes cargo_fmt/cargo_clippy/cargo_test from the `ci` profile so this
  # job never has to install Rust just to run hk.
  hk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-hk-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      # Full history, not the default depth-1: pull_request events check out
      # a synthetic merge commit, and with a shallow/grafted fetch its true
      # parent count isn't visible to libgit2, so cog can't recognize it as
      # a merge commit and cog.toml's ignore_merge_commits doesn't apply.
      - uses: hugoh/gh-workflows/setup@e3deb909891d6fc8089311f2e91e85796eb6c725 # v1.9.2
        with:
          fetch-depth: "0"
      - uses: hugoh/gh-workflows/hk-check@e3deb909891d6fc8089311f2e91e85796eb6c725 # v1.9.2

  # cargo-fmt/deny/audit don't need to compile the crate (fmt is syntax-only,
  # deny/audit only inspect Cargo.toml/Cargo.lock metadata), so they run on
  # Linux even though the crate itself is macOS-only (core-foundation,
  # system-configuration, objc2-core-wlan with no cfg(target_os) gating) and
  # wouldn't build here.
  check-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-check-linux-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e3deb909891d6fc8089311f2e91e85796eb6c725 # v1.9.2
      - name: Ensure rustfmt component
        run: rustup component add rustfmt
      - name: Cargo fmt
        run: mise run check:cargo-fmt
      - name: Cargo deny
        run: mise run check:cargo-deny
      - name: Cargo audit
        run: mise run check:cargo-audit

  # Clippy (needs to compile the crate) and the Rust/Swift tests, on macOS
  # because this project's whole reason to exist is macOS-specific behavior
  # (scutil, ping, netdev's VPN detection) — a Linux build would only prove
  # it compiles, not that it works, and it doesn't even compile there (see
  # check-linux above). Split from `build` below so the two run concurrently
  # instead of the app-bundling step waiting behind every cargo check.
  check-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: ci-check-macos-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e3deb909891d6fc8089311f2e91e85796eb6c725 # v1.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Ensure clippy component
        run: rustup component add clippy
      - name: Cargo clippy
        run: mise run check:cargo-clippy
      - name: Cargo test
        run: mise run test:rust
      - name: Cache Swift build
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: apps/NetCheck/.build
          key: swift-build-${{ runner.os }}-${{ hashFiles('apps/NetCheck/Package.swift', 'apps/NetCheck/Package.resolved', 'apps/NetCheck/Sources/**', 'apps/NetCheck/Tests/**') }}
          restore-keys: |
            swift-build-${{ runner.os }}-
      - name: SwiftLint
        run: mise run check:swiftlint
      - name: Swift test
        run: mise run test:swift

  # Release build + app bundle. `mise run bundle:swiftui` builds the release
  # netcheck CLI and the SwiftUI app itself (it doesn't reuse anything from
  # `check`, which only builds dev/test profiles), so this runs as its own
  # job in parallel with `check` rather than after it.
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: ci-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e3deb909891d6fc8089311f2e91e85796eb6c725 # v1.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cache Swift build
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: apps/NetCheck/.build
          key: swift-build-${{ runner.os }}-${{ hashFiles('apps/NetCheck/Package.swift', 'apps/NetCheck/Package.resolved', 'apps/NetCheck/Sources/**') }}
          restore-keys: |
            swift-build-${{ runner.os }}-
      - name: Bundle NetCheck.app
        run: mise run bundle:swiftui
      - name: Upload NetCheck.app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NetCheck.app
          path: target/NetCheck.app
          retention-days: 14

  # Static project site (site/), deployed to GitHub Pages. Only on pushes
  # to main — PRs just get the `check`/`build` jobs above.
  pages-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@e3deb909891d6fc8089311f2e91e85796eb6c725 # v1.9.2
      - name: Build site
        run: mise run build:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
