[graph]
targets = []
all-features = true

[advisories]
ignore = [
  # paste (dtolnay) is archived/unmaintained but has no known
  # vulnerability, just no further releases; pulled in transitively via
  # netdev -> netlink-packet-core, not a direct dependency.
  "RUSTSEC-2024-0436",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
confidence-threshold = 0.8
# This workspace's own crates (netcheck, netstatus, genweb) are unpublished
# (publish = false) and carry no license field; don't fail the check on
# their own not-for-crates.io code.
private = { ignore = true }

[bans]
multiple-versions = "warn"
# The path dep between this workspace's own crates (netstatus <- netcheck)
# carries no version constraint since they're always built together in-tree;
# cargo-deny flags any unversioned dependency as a wildcard regardless of
# whether it's a workspace-local path dep or a real crates.io "*".
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
