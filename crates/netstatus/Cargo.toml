[package]
name = "netstatus"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
core-foundation = "0.10.1"
libc = "0.2.189"
netdev = "0.46"
objc2-core-wlan = "0.3.2"
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
surge-ping = "0.9.0"
system-configuration = "0.8.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "time"] }
ureq = { version = "3.4.0", default-features = false }
