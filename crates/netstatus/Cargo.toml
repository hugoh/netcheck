[package]
name = "netstatus"
version = "0.1.0"
edition.workspace = true

[dependencies]
core-foundation = "0.10.1"
netdev = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
surge-ping = "0.9.0"
system-configuration = "0.8.0"
tokio = { version = "1.53.1", features = ["rt", "time", "net", "macros"] }
