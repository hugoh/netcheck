[extend]
useDefault = true

# `gitleaks dir`/`detect --no-git`-style filesystem scans aren't git-aware
# and don't respect .gitignore, so without this they walk the SwiftPM
# `apps/NetCheck/.build/` and `target/` (mise task output) build trees —
# multiple GB of compiled artifacts, not source — making local `hk check`/
# `gitleaks dir` runs take tens of seconds for no benefit (nothing
# secret-shaped lives in build output that isn't already in the source that
# generated it).
[allowlist]
paths = [
  '''target/''',
  '''apps/NetCheck/\.build/''',
]
